<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Connexion</title>
<link rel="icon" href="/favicon-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600&display=swap">
<style>
  :root {
    --paper: #FFFFFF;
    --ink: #0A0A0A;
    --moss: #71717A;
    --field: #F4F4F5;
    --vivid: #00F060;
    --vivid-deep: #00D452;
    --emerald: #16A34A;
    --line: rgba(10, 10, 10, 0.09);
    --mx: 50%;
    --my: 50%;
  }
  @media (color-gamut: p3) {
    :root { --vivid: oklch(83.3% 0.339 147.7); --vivid-deep: oklch(75.8% 0.312 147.4); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--paper); color: var(--ink);
    font: 15px/1.5 "Inter", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }

  /* Trame de points qui s'allume en vert autour du curseur */
  .grid {
    position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(10, 10, 10, 0.10) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .grid::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(var(--vivid) 1.2px, transparent 1.4px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(220px circle at var(--mx) var(--my), #000 0%, transparent 70%);
            mask-image: radial-gradient(220px circle at var(--mx) var(--my), #000 0%, transparent 70%);
    opacity: .9;
  }

  /* Cadre : carte avec coins en équerre qui s'ouvrent au survol / focus */
  .frame {
    position: relative; width: 100%; max-width: 380px; padding: 40px 34px 34px;
    background: rgba(255, 255, 255, 0.92); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: 0 1px 2px rgba(10,10,10,.04), 0 24px 60px -20px rgba(10,10,10,.18);
    backdrop-filter: blur(6px);
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform .25s ease-out;
    animation: enter .6s cubic-bezier(.2,.7,.2,1) .05s both;
  }
  @keyframes enter { from { opacity: 0; translate: 0 12px; } }
  .frame::before { /* reflet vert qui suit le curseur sur la bordure */
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
    background: radial-gradient(180px circle at var(--cx, 50%) var(--cy, 0%), var(--vivid), transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity .3s;
  }
  .frame:hover::before, .frame:focus-within::before { opacity: 1; }

  .corner { position: absolute; width: 18px; height: 18px; border: 2px solid var(--ink); pointer-events: none;
            transition: all .35s cubic-bezier(.2,.7,.2,1); }
  .tl { top: -9px; left: -9px; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; }
  .tr { top: -9px; right: -9px; border-left: 0; border-bottom: 0; border-top-right-radius: 6px; }
  .bl { bottom: -9px; left: -9px; border-right: 0; border-top: 0; border-bottom-left-radius: 6px; }
  .br { bottom: -9px; right: -9px; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; }
  .frame:hover .corner, .frame:focus-within .corner { border-color: var(--emerald); width: 28px; height: 28px; }
  .frame:hover .tl, .frame:focus-within .tl { top: -13px; left: -13px; }
  .frame:hover .tr, .frame:focus-within .tr { top: -13px; right: -13px; }
  .frame:hover .bl, .frame:focus-within .bl { bottom: -13px; left: -13px; }
  .frame:hover .br, .frame:focus-within .br { bottom: -13px; right: -13px; }
  .frame.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { translate: -6px 0; } 40%, 80% { translate: 6px 0; } }

  .logo { display: block; width: 190px; max-width: 100%; height: auto; margin: 0 auto 28px; }
  h1 { font: 600 22px/1.2 "Poppins", ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.01em; margin: 0 0 22px; text-align: center; }

  .field { position: relative; margin-top: 12px; }
  input {
    width: 100%; height: 54px; padding: 22px 16px 6px; border-radius: 14px;
    border: 1px solid transparent; background: var(--field); color: var(--ink);
    font: 500 15px "Inter", ui-sans-serif, system-ui, sans-serif;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input:focus { outline: none; background: var(--paper); border-color: var(--emerald); box-shadow: 0 0 0 4px rgba(22, 163, 74, .14); }
  /* Libellé flottant */
  .field label {
    position: absolute; left: 17px; top: 17px; color: var(--moss); font-size: 15px; pointer-events: none;
    transform-origin: left top; transition: transform .18s ease, color .18s ease;
  }
  input:focus + label, input:not(:placeholder-shown) + label { transform: translateY(-10px) scale(.76); }
  input:focus + label { color: var(--emerald); }
  .field.pw input { padding-right: 52px; }
  .toggle {
    position: absolute; right: 7px; top: 7px; width: 40px; height: 40px; border: 0; border-radius: 10px;
    background: transparent; color: var(--moss); cursor: pointer; display: grid; place-items: center;
  }
  .toggle:hover { color: var(--ink); background: rgba(10,10,10,.05); }
  .toggle:focus-visible { outline: 2px solid var(--emerald); outline-offset: 1px; }
  .toggle svg { width: 19px; height: 19px; fill: currentColor; }

  .submit {
    position: relative; overflow: hidden; margin-top: 20px; width: 100%; height: 52px; border: 0; border-radius: 999px;
    background: var(--ink); color: #FFFFFF; cursor: pointer;
    font: 600 15px "Poppins", ui-sans-serif, system-ui, sans-serif;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; isolation: isolate;
    transition: color .3s;
  }
  .submit::before { /* remplissage vert depuis la gauche au survol */
    content: ""; position: absolute; inset: 0; z-index: -1; background: var(--vivid);
    transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .submit:hover::before, .submit:focus-visible::before { transform: scaleX(1); }
  .submit:hover, .submit:focus-visible { color: var(--ink); }
  .submit:focus-visible { outline: 3px solid var(--emerald); outline-offset: 3px; }
  .submit svg { width: 17px; height: 17px; fill: currentColor; transition: transform .25s; }
  .submit:hover svg { transform: translateX(3px); }
  .submit[disabled] { cursor: progress; }

  .err { display: none; margin: 0 0 6px; padding: 11px 14px; border-radius: 12px; background: #FEF2F2;
         color: #991B1B; font-size: 13.5px; text-align: center; }

  @media (max-width: 480px) {
    .frame { padding: 34px 22px 26px; }
    .corner { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .frame { transform: none; }
  }
</style>
</head>

  <h1>Connexion</h1>

  <form method="post" action="/api/admin/login" autocomplete="on" id="login">
    <p class="err" id="err" role="alert"></p>

    <div class="field">
      <input id="username" name="username" type="text" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="username">Utilisateur</label>
    </div>

    <div class="field pw">
      <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
      <label for="password">Mot de passe</label>
      <button type="button" class="toggle" id="toggle" aria-label="Afficher le mot de passe" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 5C6.5 5 2.7 9.1 1.5 12c1.2 2.9 5 7 10.5 7s9.3-4.1 10.5-7C21.3 9.1 17.5 5 12 5zm0 11.5a4.5 4.5 0 110-9 4.5 4.5 0 010 9zm0-7a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/></svg>
      </button>
    </div>

    <button type="submit" class="submit" id="submit">
      <span id="submit-label">Se connecter</span>
      <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
    </button>
  </form>
</main>

<script>
  (function () {
    var root = document.documentElement;
    var frame = document.getElementById("frame");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Messages volontairement génériques
    var messages = { "1": "Identifiants invalides.", "rate": "Trop de tentatives. Réessaie plus tard.", "config": "Connexion indisponible." };
    var code = new URLSearchParams(location.search).get("e");
    if (code && Object.prototype.hasOwnProperty.call(messages, code)) {
      var err = document.getElementById("err");
      err.textContent = messages[code];
      err.style.display = "block";
      if (!reduce) frame.addEventListener("animationend", function once(e) {
        if (e.animationName !== "enter") return;
        frame.removeEventListener("animationend", once);
        frame.classList.add("shake");
      });
      history.replaceState(null, "", location.pathname);
    }

    // Trame et cadre qui réagissent au curseur
    if (!reduce) {
      var raf = 0;
      window.addEventListener("pointermove", function (e) {
        if (raf) return;
        raf = requestAnimationFrame(function () {
          raf = 0;
          root.style.setProperty("--mx", e.clientX + "px");
          root.style.setProperty("--my", e.clientY + "px");
          var r = frame.getBoundingClientRect();
          var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
          frame.style.setProperty("--cx", (px * 100) + "%");
          frame.style.setProperty("--cy", (py * 100) + "%");
          var inside = px >= 0 && px <= 1 && py >= 0 && py <= 1;
          frame.style.setProperty("--rx", inside ? ((0.5 - py) * 5) + "deg" : "0deg");
          frame.style.setProperty("--ry", inside ? ((px - 0.5) * 5) + "deg" : "0deg");
        });
      });
    }

    var pw = document.getElementById("password");
    var toggle = document.getElementById("toggle");
    toggle.addEventListener("click", function () {
      var show = pw.type === "password";
      pw.type = show ? "text" : "password";
      toggle.setAttribute("aria-pressed", String(show));
      toggle.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
      pw.focus();
    });

    document.getElementById("login").addEventListener("submit", function () {
      document.getElementById("submit").disabled = true;
      document.getElementById("submit-label").textContent = "Connexion…";
    });
    window.addEventListener("pageshow", function () {
      document.getElementById("submit").disabled = false;
      document.getElementById("submit-label").textContent = "Se connecter";
    });
  })();
</script>
